<!DOCTYPE html>
<html>
<head>
    <title>SafeRide</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>

        body {
            font-family: Arial;
            text-align: center;
        }

        #map {
            height: 400px;
            width: 100%;
            margin-top: 10px;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            background: #f0f8ff;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }

        input {
            padding: 8px;
            width: 200px;
        }

        button {
            padding: 8px;
        }
    </style>
</head>

<body>

<h1>SafeRide</h1>

<p id="location">Getting location...</p>

<input type="text" id="searchBox" placeholder="Enter location">
<button onclick="searchLocation()">Search</button>

<!-- ✅ RESULT WILL SHOW HERE -->
<div id="result">Distance & time will appear here</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let currentLat, currentLon;
let destLat, destLon;
let map, marker;

// ✅ INIT MAP
map = L.map('map').setView([17.385, 78.4867], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
}).addTo(map);

// ✅ GET CURRENT LOCATION
navigator.geolocation.getCurrentPosition(function(position) {

    currentLat = position.coords.latitude;
    currentLon = position.coords.longitude;

    document.getElementById("location").innerHTML =
        "Latitude: " + currentLat + "<br>Longitude: " + currentLon;

    marker = L.marker([currentLat, currentLon]).addTo(map);
    map.setView([currentLat, currentLon], 14);
});

// ✅ SEARCH LOCATION

function searchLocation() {
    const location = document.getElementById("searchBox").value;

    fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(location)}`)
    .then(response => response.json())
    .then(data => {

        if (data.length > 0) {

            destlat = parseFloat(data[0].lat);
            destlon = parseFloat(data[0].lon);

            // ✅ Calculate distance & time
            calculateTimeAndDistance();

            // ✅ Move map
            map.setView([destlat, destlon], 13);

            // ✅ Add marker
            L.marker([destlat, destlon]).addTo(map)
                .bindPopup(location)
                .openPopup();

        } else {
            alert("No results found");
        }
    })
    .catch(error => {
        console.error(error);
        alert("Error in search");
    });
}
    
// ✅ DISTANCE FUNCTION

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Earth radius in KM
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}


// ✅ DISTANCE + TIME (UPDATED ✅ NO ALERT)
function calculateDistanceAndTime() {

    if (currentLat && currentLon && destLat && destLon) {

        let distance = calculateDistance(currentLat, currentLon, destLat, destLon);

        let speed = 30; // km/h
        let time = (distance / speed) * 60;

        // ✅ DISPLAY INSIDE APP
        document.getElementById("result").innerHTML = `
            <b>Route Details</b><br><br>
            📍 Distance: ${distance.toFixed(2)} km <br>
            ⏱ Time: ${time.toFixed(1)} minutes
        `;
    }
}
    
// ✅ ✅ ARRIVAL ALERT + VIBRATION
function checkArrival() {

    if (currentLat && currentLon && destLat && destLon) {

        let distance = calculateDistance(currentLat, currentLon, destLat, destLon);

        // ✅ if within 200 meters
        if (distance < 0.2) {

            // ✅ Alert
            document.getElementById("result").innerHTML = `
                <b style="color:green;">✅ You reached your stop!</b>
            `;

            // ✅ Sound
            let audio = new Audio("https://www.soundjay.com/buttons/beep-07.wav");
            audio.play();

            // ✅ Vibration (mobile only)
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500]);
            }
        }
    }
}

// ✅ ✅ EMERGENCY BUTTON FUNCTION
function sendEmergency() {

    if (currentLat && currentLon) {

        let message = `EMERGENCY! My location:
https://www.google.com/maps?q=${currentLat},${currentLon}`;

        alert(message); // for now

        // 👉 later you can integrate SMS / WhatsApp API
    }
}

</script>

</body>
</html>
