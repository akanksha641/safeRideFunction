<!DOCTYPE html>
<html>
<head>
    <title>Bus Assist App</title>

    <!-- ✅ Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #map {
            height: 400px;
            width: 100%;
            margin-top: 10px;
        }

        input {
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h2>🚍 Bus Assist App</h2>

<!-- ✅ Buttons -->
<button onclick="startTracking()">Start Tracking</button>
<button onclick="emergency()">Emergency</button>

<br><br>

<!-- ✅ Location Display -->
<div id="location">Location: Not started</div>

<br>

<!-- ✅ Search -->
<input type="text" id="searchBox" placeholder="Enter location">
<button onclick="searchLocation()">Search</button>

<!-- ✅ Map -->
<div id="map"></div>

<!-- ✅ Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ✅ GLOBAL VARIABLES
let map;
let marker;

let currentLat, currentLon;
let destLat, destLon;

// ✅ START TRACKING
function startTracking() {
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(showPosition, showError);
    } else {
        alert("Geolocation not supported");
    }
}

// ✅ SHOW CURRENT LOCATION
function showPosition(position) {
    let lat = position.coords.latitude;
    let lon = position.coords.longitude;

    currentLat = lat;
    currentLon = lon;

    document.getElementById("location").innerHTML =
        "Latitude: " + lat + "<br>Longitude: " + lon;

    if (!map) {
        map = L.map('map').setView([lat, lon], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'OpenStreetMap'
        }).addTo(map);

        marker = L.marker([lat, lon]).addTo(map)
            .bindPopup("You are here")
            .openPopup();
    } else {
        marker.setLatLng([lat, lon]);
        map.setView([lat, lon], 15);
    }

    // ✅ AUTO ALERT CHECK
    checkArrival();
}

// ✅ SEARCH LOCATION
async function searchLocation() {

    const place = document.getElementById("searchBox").value;

    if (!map) {
        alert("⚠️ Click Start Tracking first");
        return;
    }

    try {
        const response = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${place}`
        );

        const data = await response.json();

        if (data.length > 0) {

            destLat = parseFloat(data[0].lat);
            destLon = parseFloat(data[0].lon);

            map.setView([destLat, destLon], 15);

            L.marker([destLat, destLon]).addTo(map)
                .bindPopup("Destination: " + place)
                .openPopup();

            alert("✅ Location found: " + place);

            calculateDistanceAndTime();

        } else {
            alert("❌ Location not found");
        }

    } catch (error) {
        alert("❌ Error in search");
    }
}

// ✅ DISTANCE FUNCTION
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
}

// ✅ DISTANCE + TIME
function calculateDistanceAndTime() {

    if (currentLat && currentLon && destLat && destLon) {

        let distance = calculateDistance(currentLat, currentLon, destLat, destLon);

        let speed = 30; // km/h
        let time = (distance / speed) * 60;

        alert(
            "📍 Distance: " + distance.toFixed(2) + " km\n" +
            "⏱️ Time: " + time.toFixed(1) + " minutes"
        );
    }
}

// ✅ AUTO ALERT WHEN NEAR DESTINATION
function checkArrival() {
    if (currentLat && currentLon && destLat && destLon) {

        let distance = calculateDistance(currentLat, currentLon, destLat, destLon);

        if (distance < 0.2) { // 200 meters
            alert("🚨 Get down now! You reached your stop");

            // ✅ vibration
            if (navigator.vibrate) {
                navigator.vibrate(1000);
            }

            destLat = null;
            destLon = null;
        }
    }
}

// ✅ ERROR HANDLING
function showError() {
    alert("⚠️ Please allow location access");
}

// ✅ EMERGENCY
function emergency() {
    alert("🚨 Emergency Alert Sent!");
}

</script>

</body>
</html>
