<!DOCTYPE html>
<html>
<head>
    <title>SafeRide</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>

        body {
            font-family: Arial;
            text-align: center;
        }

        #map {
            height: 400px;
            width: 100%;
            margin-top: 10px;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            background: #f0f8ff;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }

        input {
            padding: 8px;
            width: 200px;
        }

        button {
            padding: 8px;
        }
    </style>
</head>

<body>

<h1>SafeRide</h1>

<p id="location">Getting location...</p>

<input type="text" id="searchBox" placeholder="Enter location">
<button onclick="searchLocation()">Search</button>

<!-- ✅ RESULT WILL SHOW HERE -->
<div id="result">Distance & time will appear here</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let currentLat, currentLon;
let destLat, destLon;
let map, marker;

// ✅ INIT MAP
const map = L.map('map').setView([17.4476, 78.3713], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
}).addTo(map);

// ✅ GET CURRENT LOCATION
navigator.geolocation.getCurrentPosition(function(position) {

    currentLat = position.coords.latitude;
    currentLon = position.coords.longitude;

    document.getElementById("location").innerHTML =
        "Latitude: " + currentLat + "<br>Longitude: " + currentLon;

    marker = L.marker([currentLat, currentLon]).addTo(map);
    map.setView([currentLat, currentLon], 14);
});

// ✅ SEARCH LOCATION

async function searchLocation() {
    const location = document.getElementById("searchBox").value;

    if (!location) {
        alert("Enter location");
        return;
    }

    console.log("Searching:", location); // ✅ check in console

    const response = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&q=${location}`
    );

    const data = await response.json();

    if (data.length === 0) {
        alert("Location not found");
        return;
    }

    const lat = parseFloat(data[0].lat);
    const lon = parseFloat(data[0].lon);

    console.log(lat, lon);

    // ✅ Move map
    map.setView([lat, lon], 13);

    // ✅ Marker
    L.marker([lat, lon]).addTo(map)
        .bindPopup(location)
        .openPopup();
}


// ✅ DISTANCE FUNCTION

function calculateTimeAndDistance() {
    if (currentLat && currentLon && destlat && destlon) {

        let distance = calculateDistance(currentLat, currentLon, destlat, destlon);
        let speed = 40;
        let time = (distance / speed) * 60;

        document.getElementById("result").innerHTML =
            `Distance: ${distance.toFixed(2)} km <br>
             Time: ${time.toFixed(1)} min`;
    }
}

// ✅ DISTANCE + TIME (UPDATED ✅ NO ALERT)
function calculateDistanceAndTime() {

    if (currentLat && currentLon && destLat && destLon) {

        let distance = calculateDistance(currentLat, currentLon, destLat, destLon);

        let speed = 30; // km/h
        let time = (distance / speed) * 60;

        // ✅ DISPLAY INSIDE APP
        document.getElementById("result").innerHTML = `
            <b>Route Details</b><br><br>
            📍 Distance: ${distance.toFixed(2)} km <br>
            ⏱ Time: ${time.toFixed(1)} minutes
        `;
    }
}
    
// ✅ ✅ ARRIVAL ALERT + VIBRATION
function checkArrival() {

    if (currentLat && currentLon && destLat && destLon) {

        let distance = calculateDistance(currentLat, currentLon, destLat, destLon);

        // ✅ if within 200 meters
        if (distance < 0.2) {

            // ✅ Alert
            document.getElementById("result").innerHTML = `
                <b style="color:green;">✅ You reached your stop!</b>
            `;

            // ✅ Sound
            let audio = new Audio("https://www.soundjay.com/buttons/beep-07.wav");
            audio.play();

            // ✅ Vibration (mobile only)
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500]);
            }
        }
    }
}

// ✅ ✅ EMERGENCY BUTTON FUNCTION
function sendEmergency() {

    if (currentLat && currentLon) {

        let message = `EMERGENCY! My location:
https://www.google.com/maps?q=${currentLat},${currentLon}`;

        alert(message); // for now

        // 👉 later you can integrate SMS / WhatsApp API
    }
}

</script>

</body>
</html>
