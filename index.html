
<!DOCTYPE html>
<html>
<head>
    <title>Bus Assist App</title>

    <!-- Leaflet CSS -->
   <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #map {
            height: 400px;
            width: 100%;
            margin-top: 10px;
        }

        input {
            padding: 8px;
            width: 200px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h2>🚍 Bus Assist App</h2>

<!-- Buttons -->
<button onclick="startTracking()">Start Tracking</button>
<button onclick="emergency()">Emergency</button>

<br><br>

<!-- Location Display -->
<div id="location">Location: Not started</div>

<br>

<!-- ✅ SEARCH BOX -->
<input type="text" id="searchBox" placeholder="Enter location">
<button onclick="searchLocation()">Search</button>

<!-- ✅ MAP -->
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let marker;

// ✅ START GPS TRACKING
function startTracking() {
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(showPosition);
    } else {
        alert("Geolocation not supported");
    }
}

// ✅ SHOW CURRENT LOCATION
function showPosition(position) {
    let lat = position.coords.latitude;
    let lon = position.coords.longitude;

    document.getElementById("location").innerHTML =
        "Latitude: " + lat + "<br>Longitude: " + lon;

    // First time create map
    if (!map) {
      
  map = L.map('map').setView([lat, lon], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Map data © OpenStreetMap'
        }).addTo(map);

        marker = L.marker([lat, lon]).addTo(map)
                  .bindPopup("You are here")
                  .openPopup();

    } else {
        // Update position
        marker.setLatLng([lat, lon]);
        map.setView([lat, lon]);
    }
}
// ✅Distant and time

let currentLat, currentLon;
let destLat, destLon;

    if (data.length > 0) {

        destLat = parseFloat(data[0].lat);   // ✅ store destination
        destLon = parseFloat(data[0].lon);

        map.setView([destLat, destLon], 15);

        L.marker([destLat, destLon]).addTo(map)
            .bindPopup("Destination: " + place)
            .openPopup();

        alert("✅ Location found: " + place);

        // ✅ CALCULATE DISTANCE + TIME HERE
        calculateDistanceAndTime();

    } else {
        alert("❌ Location not found");
    }
}

function calculateDistanceAndTime() {

    if (currentLat && currentLon && destLat && destLon) {

        let distance = calculateDistance(currentLat, currentLon, destLat, destLon);

        let speed = 30; // km/h
        let time = (distance / speed) * 60;

        alert(
            "📍 Distance: " + distance.toFixed(2) + " km\n" +
            "⏱️ Time: " + time.toFixed(1) + " minutes"
        );
    }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
}


// ✅ SEARCH LOCATION FUNCTION

async function searchLocation() {
    const place = document.getElementById("searchBox").value;

    if (!map) {
        alert("⚠️ Please click 'Start Tracking' first");
        return;
    }

    const response = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&q=${place}`
    );

    const data = await response.json();

    if (data.length > 0) {
        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);

        map.setView([lat, lon], 15);

        L.marker([lat, lon]).addTo(map)
            .bindPopup("Searched: " + place)
            .openPopup();

        alert("✅ Location found: " + place);
    } else {
        alert("❌ Location not found");
    }
}


// ✅ EMERGENCY BUTTON
function emergency() {
    alert("🚨 Emergency Alert Sent!");
}

</script>

</body>
</html>
